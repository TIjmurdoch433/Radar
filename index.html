<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>

<style>
  :root{
    color-scheme: light;
    --bg:#f5f6f0;
    --surface:#ffffff;
    --surface-2:#eef1e6;
    --surface-hover:#e6eadb;
    --text-primary:#12140f;
    --text-secondary:#4c5245;
    --text-muted:#82897a;
    --border:rgba(18,20,15,0.12);
    --ring-line:#c9cebc;
    --grid-hair:#e3e6da;
    --accent:#5c2a6e;
    --accent-2:#1d7a46;
    --priority:#b8811f;
    --cat-1:#2a78d6; --cat-2:#eb6834; --cat-3:#1baf7a; --cat-4:#eda100;
    --cat-5:#e87ba4; --cat-6:#008300; --cat-7:#4a3aa7; --cat-8:#e34948;
  }
  @media (prefers-color-scheme: dark){
    :root:where(:not([data-theme="light"])){
      color-scheme: dark;
      --bg:#0e100c;
      --surface:#171a14;
      --surface-2:#1e2318;
      --surface-hover:#242b1c;
      --text-primary:#f3f5ee;
      --text-secondary:#c6cbb9;
      --text-muted:#8b917f;
      --border:rgba(255,255,255,0.14);
      --ring-line:#333a2a;
      --grid-hair:#242a1d;
      --accent:#cd9fe2;
      --accent-2:#5fcf8e;
      --priority:#e0b84a;
      --cat-1:#3987e5; --cat-2:#d95926; --cat-3:#199e70; --cat-4:#c98500;
      --cat-5:#d55181; --cat-6:#2fae2f; --cat-7:#9085e9; --cat-8:#e66767;
    }
  }
  :root[data-theme="dark"]{
    color-scheme: dark;
    --bg:#0e100c; --surface:#171a14; --surface-2:#1e2318; --surface-hover:#242b1c;
    --text-primary:#f3f5ee; --text-secondary:#c6cbb9; --text-muted:#8b917f;
    --border:rgba(255,255,255,0.14); --ring-line:#333a2a; --grid-hair:#242a1d;
    --accent:#cd9fe2; --accent-2:#5fcf8e; --priority:#e0b84a;
    --cat-1:#3987e5; --cat-2:#d95926; --cat-3:#199e70; --cat-4:#c98500;
    --cat-5:#d55181; --cat-6:#2fae2f; --cat-7:#9085e9; --cat-8:#e66767;
  }
  :root[data-theme="light"]{
    color-scheme: light;
    --bg:#f5f6f0; --surface:#ffffff; --surface-2:#eef1e6; --surface-hover:#e6eadb;
    --text-primary:#12140f; --text-secondary:#4c5245; --text-muted:#82897a;
    --border:rgba(18,20,15,0.12); --ring-line:#c9cebc; --grid-hair:#e3e6da;
    --accent:#5c2a6e; --accent-2:#1d7a46; --priority:#b8811f;
    --cat-1:#2a78d6; --cat-2:#eb6834; --cat-3:#1baf7a; --cat-4:#eda100;
    --cat-5:#e87ba4; --cat-6:#008300; --cat-7:#4a3aa7; --cat-8:#e34948;
  }

  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    margin:0;
    background:var(--bg);
    color:var(--text-primary);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  #root{ min-height:100%; }

  @media (prefers-reduced-motion: reduce){
    *{ transition:none !important; animation:none !important; }
  }

  ::selection{ background:var(--accent); color:#fff; }

  .app-shell{ max-width:1440px; margin:0 auto; padding:20px 20px 48px; }

  .header{
    display:flex; align-items:flex-start; justify-content:space-between; gap:20px;
    flex-wrap:wrap; margin-bottom:18px;
  }
  .brand{ display:flex; gap:14px; align-items:flex-start; }

  .brand h1{

  .brand p{ margin:0; color:var(--text-secondary); font-size:0.86rem; max-width:52ch; }
  .eyebrow{

  .header-controls{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .search-input{

    outline:none;
  }
  .search-input:focus{ border-color:var(--accent); box-shadow:0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent); }

  .icon-btn{

  .filter-group{ display:flex; align-items:center; gap:7px; flex-wrap:wrap; }
  .chip{

  .panel{
    background:var(--surface); border:1px solid var(--border); border-radius:14px;
    padding:16px;

  .chart-caption .count-pill{

  }

  .radar-svg{ display:block; width:100%; height:auto; position:relative; z-index:1; }
  .radar-sweep{
    position:absolute; top:50%; left:50%; width:80.8%; aspect-ratio:1/1;
    transform:translate(-50%,-50%); border-radius:50%; pointer-events:none; z-index:0;
    background:conic-gradient(from 0deg,
      color-mix(in srgb, var(--accent-2) 32%, transparent) 0deg,
      transparent 65deg, transparent 360deg);
    animation: radar-sweep-spin 9s linear infinite;
  }
  @keyframes radar-sweep-spin{ from{ transform:translate(-50%,-50%) rotate(0deg); } to{ transform:translate(-50%,-50%) rotate(360deg); } }

  .ring-label{ font-size:11px; font-weight:700; letter-spacing:0.06em; fill:var(--text-muted); }
  .ring-label-bg{ fill:var(--surface); }
  .sector-label{ font-size:20px; font-weight:750; }
  .divider-line{ stroke:var(--text-muted); stroke-width:1.75; }
  .ring-circle{ fill:none; stroke:var(--ring-line); stroke-width:1; stroke-dasharray:2 3; }
  .hub-circle{ fill:var(--surface); stroke:var(--border); stroke-width:1; }
  .hub-title{ font-size:13px; font-weight:800; letter-spacing:0.08em; fill:var(--text-primary); }
  .hub-sub{ font-size:8px; font-weight:700; letter-spacing:0.06em; fill:var(--text-muted); }
  .priority-ring{ stroke:var(--priority); stroke-width:1.4; stroke-dasharray:2 2; }
  .dot-mark{ transition: r 120ms ease; }

  .dot:focus .dot-mark{ stroke:var(--text-primary); stroke-width:2.5px; }

  .legend-swatch{ width:9px; height:9px; border-radius:50%; flex-shrink:0; }

  .legend{
    display:flex; flex-wrap:wrap; gap:22px; margin-top:14px; padding-top:14px;
    border-top:1px solid var(--border); font-size:0.72rem; color:var(--text-secondary);
  }
  .legend-block{ display:flex; flex-direction:column; gap:6px; }
  .legend-title{
    font-size:0.62rem; font-weight:700; letter-spacing:0.09em; text-transform:uppercase;
    color:var(--text-muted);
  }
  .legend-row{ display:flex; align-items:center; gap:7px; }
  .legend-size-demo{ display:flex; align-items:center; gap:10px; }
  .legend-size-dot{ border-radius:50%; background:var(--text-muted); flex-shrink:0; }
  .legend-priority-ring{
    width:14px; height:14px; border-radius:50%; border:1.4px dashed var(--priority); flex-shrink:0;
  }

  .table-wrap{ overflow-x:auto; }
  table.tech-table{ width:100%; border-collapse:collapse; font-size:0.8rem; }
  table.tech-table thead th{
    text-align:left; font-size:0.66rem; font-weight:700; letter-spacing:0.07em; text-transform:uppercase;
    color:var(--text-muted); padding:8px 10px; border-bottom:1px solid var(--border); cursor:pointer;
    white-space:nowrap; position:sticky; top:0; background:var(--surface);
  }
  table.tech-table thead th:hover{ color:var(--text-primary); }
  table.tech-table tbody td{ padding:9px 10px; border-bottom:1px solid var(--grid-hair); vertical-align:middle; }
  table.tech-table tbody tr{ cursor:pointer; }
  table.tech-table tbody tr:hover{ background:var(--surface-hover); }
  table.tech-table tbody tr.selected{ background:color-mix(in srgb, var(--accent) 10%, transparent); }
  .table-scroll{ max-height:520px; overflow-y:auto; }
  .name-cell{ display:flex; align-items:center; gap:8px; font-weight:650; }
  .theme-pill{
    display:inline-flex; align-items:center; gap:6px; font-size:0.7rem; font-weight:650;
    padding:3px 9px; border-radius:999px; background:var(--surface-2); white-space:nowrap;
  }
  .maturity-pill{
    display:inline-flex; font-size:0.7rem; font-weight:650; padding:3px 9px; border-radius:999px;
    background:var(--surface-2); color:var(--text-secondary); white-space:nowrap;
  }
  .num-cell{ font-variant-numeric: tabular-nums; font-weight:700; }

  .intro-banner{ margin-bottom:16px; }
  .filter-panel{ min-height:200px; }
  .filter-panel-head{ display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:8px; }
  .filter-panel .filter-group{ flex-direction:column; align-items:flex-start; gap:6px; }
  .filter-panel .chip{ width:100%; justify-content:flex-start; }
  .filter-panel .reset-btn{ margin-top:8px; }
  .clear-btn{
    border:1px solid var(--border); background:var(--surface-2); color:var(--text-secondary);
    border-radius:6px; padding:3px 9px; font-size:0.68rem; font-weight:650; cursor:pointer;
  }
  .clear-btn:hover{ background:var(--surface-hover); color:var(--text-primary); }
  .intro-card h3{ font-size:1rem; font-weight:750; margin:0 0 6px; }
  .intro-card p{ font-size:0.83rem; color:var(--text-secondary); line-height:1.5; margin:0 0 14px; }
  .priority-intro{ margin:6px 0 16px; max-width:78ch; }
  .priority-intro p{ font-size:0.83rem; color:var(--text-secondary); line-height:1.55; margin:0 0 10px; }
  .priority-intro p:last-child{ margin-bottom:0; }
  .mix-row{ display:flex; align-items:center; gap:8px; margin-bottom:7px; }
  .mix-label{ width:92px; font-size:0.72rem; color:var(--text-secondary); flex-shrink:0; }
  .mix-bar-track{ flex:1; height:8px; background:var(--surface-2); border-radius:4px; overflow:hidden; }
  .mix-bar-fill{ height:100%; background:var(--accent-2); border-radius:4px; }
  .mix-count{ width:22px; text-align:right; font-size:0.72rem; font-variant-numeric: tabular-nums; color:var(--text-muted); }

  .detail-card{ display:flex; flex-direction:column; gap:12px; }
  .detail-top{ display:flex; align-items:flex-start; justify-content:space-between; gap:8px; }
  .detail-badges{ display:flex; flex-wrap:wrap; gap:6px; }
  .close-btn{
    border:none; background:var(--surface-2); color:var(--text-secondary); width:26px; height:26px;
    border-radius:50%; cursor:pointer; font-size:0.9rem; line-height:1; flex-shrink:0;
  }
  .close-btn:hover{ background:var(--surface-hover); color:var(--text-primary); }
  .detail-card h3{ font-size:1.08rem; font-weight:800; margin:0; letter-spacing:-0.01em; }
  .detail-desc{ font-size:0.82rem; color:var(--text-secondary); margin:0; line-height:1.5; }
  .section-label{
    font-size:0.64rem; font-weight:700; letter-spacing:0.09em; text-transform:uppercase;
    color:var(--text-muted); margin:0 0 5px;
  }
  .rationale-text{ font-size:0.84rem; line-height:1.55; color:var(--text-primary); margin:0; }
  .meter-row{ margin-bottom:10px; }
  .meter-head{ display:flex; justify-content:space-between; font-size:0.72rem; color:var(--text-secondary); margin-bottom:4px; }
  .meter-track{ height:8px; border-radius:4px; background:var(--surface-2); overflow:hidden; }
  .meter-fill{ height:100%; border-radius:4px; }
  .footer-note{
    margin-top:26px; padding-top:16px; border-top:1px solid var(--border);
    font-size:0.72rem; color:var(--text-muted); line-height:1.6; max-width:90ch;
  }

  .tooltip-box{
    position:fixed; z-index:50; pointer-events:none; max-width:230px;
    background:var(--text-primary); color:var(--bg); border-radius:8px; padding:8px 10px;
    font-size:0.72rem; line-height:1.4; box-shadow:0 8px 20px rgba(0,0,0,0.25);
  }
  .tooltip-box .tt-name{ font-weight:750; margin-bottom:2px; }
  .tooltip-box .tt-meta{ opacity:0.8; }

  .intro-splash{
    position:fixed; inset:0; z-index:200; display:flex; align-items:center; justify-content:center;
    padding:40px 32px; overflow-y:auto;
    background: radial-gradient(circle at 28% 18%, #1f8a52 0%, #0f4a2c 48%, #082616 100%);
    opacity:1; transition: opacity 480ms ease;
  }
  .intro-splash.closing{ opacity:0; pointer-events:none; }
  .intro-splash-card{ max-width:980px; width:100%; color:#eafaf0; }
  .intro-splash-eyebrow{
    font-size:0.7rem; font-weight:700; letter-spacing:0.14em; text-transform:uppercase;
    color:#9be6ba; margin-bottom:12px;
  }
  .intro-splash-title{
    font-size:2.1rem; font-weight:800; letter-spacing:-0.02em; margin:0 0 26px; color:#ffffff;
    text-wrap:balance;
  }
  .intro-splash-columns{ display:flex; gap:48px; margin-bottom:30px; }
  .intro-splash-col{ flex:1; min-width:0; }
  @media (max-width:760px){ .intro-splash-columns{ flex-direction:column; gap:0; } }
  .intro-splash-section{ margin-bottom:24px; }
  .intro-splash-section:last-child{ margin-bottom:0; }
  .intro-splash-section h2{
    font-size:1.3rem; font-weight:800; color:#ffffff; margin:0 0 10px;
    letter-spacing:-0.01em; text-wrap:balance;
  }
  .intro-splash-section p{ font-size:0.95rem; line-height:1.65; color:#e2f7e9; margin:0 0 12px; }
  .intro-splash-section p:last-child{ margin-bottom:0; }
  .intro-splash-section p strong{ color:#ffffff; }
  .intro-splash-btn{
    background:#ffffff; color:#0f4a2c; border:none; border-radius:999px;
    padding:13px 28px; font-size:0.88rem; font-weight:750; cursor:pointer;
    box-shadow:0 10px 26px rgba(0,0,0,0.3);
  }
  .intro-splash-btn:hover{ background:#d9f9e3; }

  .modal-overlay{
    position:fixed; inset:0; z-index:100; background:rgba(0,0,0,0.45);
    display:flex; align-items:center; justify-content:center; padding:24px;
  }
  .modal-card{
    background:var(--surface); border:1px solid var(--border); border-radius:14px;
    padding:20px; width:100%; max-width:480px; max-height:85vh; overflow-y:auto;
    box-shadow:0 20px 50px rgba(0,0,0,0.35);
  }

  .live-articles{ margin-top:4px; }
  .live-status{
    font-size:0.8rem; color:var(--text-muted); line-height:1.5; margin:0;
  }
  .live-status code{
    background:var(--surface-2); border-radius:4px; padding:1px 5px; font-size:0.78rem;
  }
  .article-list{ display:flex; flex-direction:column; gap:8px; }
  .article-item{
    display:block; text-decoration:none; color:inherit; padding:8px 10px;
    border:1px solid var(--border); border-radius:8px; background:var(--surface-2);
  }
  .article-item:hover{ background:var(--surface-hover); border-color:var(--accent); }
  .article-title{ font-size:0.82rem; font-weight:700; color:var(--text-primary); line-height:1.35; }
  .article-meta{ font-size:0.68rem; color:var(--text-muted); margin-top:3px; }
  .article-summary{ font-size:0.76rem; color:var(--text-secondary); margin-top:5px; line-height:1.4; }

  .briefing-table{ width:100%; min-width:640px; border-collapse:collapse; font-size:0.82rem; }
  .briefing-table th{
    text-align:left; font-size:0.64rem; font-weight:700; letter-spacing:0.07em; text-transform:uppercase;
    color:var(--text-muted); padding:10px 12px; border-bottom:1px solid var(--border);
    background:var(--surface-2); white-space:nowrap;
  }
  .briefing-table td{ padding:14px 12px; border-bottom:1px solid var(--grid-hair); vertical-align:top; line-height:1.5; }
  .briefing-table tr:last-child td{ border-bottom:none; }
  .briefing-tech-cell{ min-width:190px; max-width:220px; cursor:pointer; }
  .briefing-tech-cell:hover .briefing-tech-name{ color:var(--accent); text-decoration:underline; }
  .briefing-rank{ display:block; font-size:0.62rem; font-weight:800; color:var(--priority); letter-spacing:0.06em; margin-bottom:3px; }
  .briefing-tech-name{ display:block; font-weight:750; font-size:0.86rem; color:var(--text-primary); margin-bottom:7px; }
  .briefing-badge{
    display:inline-flex; align-items:center; gap:6px; font-size:0.7rem; font-weight:650;
    color:var(--text-secondary); background:var(--surface-2); padding:3px 9px; border-radius:999px;
    font-variant-numeric: tabular-nums;
  }
  .briefing-why{ color:var(--text-secondary); max-width:34ch; }
  .briefing-steps{ margin:0; padding-left:18px; display:flex; flex-direction:column; gap:8px; max-width:38ch; }
  .briefing-steps li strong{ color:var(--text-primary); }
</style>
</head>
<body>
<div id="root"></div>
<script>
const { useState, useMemo, useRef, useEffect } = React;
const h = React.createElement;

const THEMES = [
  { key:'env', name:'Environmental Intelligence & Monitoring', lines:['Environmental Intelligence','& Monitoring'] },
  { key:'comp', name:'Advanced Computing & Materials', lines:['Advanced Computing','& Materials'] },
  { key:'batt', name:'Advanced Batteries & Electrification', lines:['Advanced Batteries','& Electrification'] },
  { key:'infra', name:'Infrastructure & Energy Efficiency', lines:['Infrastructure &','Energy Efficiency'] },
  { key:'cloud', name:'Cloud Sustainability & Optimisation', lines:['Cloud Sustainability','& Optimisation'] },
  { key:'ai', name:'Green AI & Software Efficiency', lines:['Green AI &','Software Efficiency'] },
  { key:'supply', name:'Supply Chain Transparency & Traceability', lines:['Supply Chain Transparency','& Traceability'] },
  { key:'circular', name:'Circularity & Lifecycle Sustainability', lines:['Circularity & Lifecycle','Sustainability'] },
];
THEMES.forEach((t,i)=>{ t.slot = i+1; });
const THEME_SLOT = {};
THEMES.forEach(t=>{ THEME_SLOT[t.name] = t.slot; });

const MATURITIES = ['Embryonic','Emerging','Developing','Mainstream'];
const MATURITY_START = { Embryonic:-90, Emerging:0, Developing:90, Mainstream:180 };

const DIMS = { cx:500, cy:500, inner:64, outer:404 };
const RING_WIDTH = (DIMS.outer - DIMS.inner) / BENEFITS.length;
const RING_BOUNDS = {};
BENEFITS.forEach((b,i)=>{ RING_BOUNDS[b] = [DIMS.inner + i*RING_WIDTH, DIMS.inner + (i+1)*RING_WIDTH]; });
const SECTOR_BOUNDS = {};
MATURITIES.forEach(m=>{ const s = MATURITY_START[m]; SECTOR_BOUNDS[m] = [s, s+90]; });

function polarToXY(angleDeg, r){
  const rad = (angleDeg - 90) * Math.PI / 180;
  return [DIMS.cx + r*Math.cos(rad), DIMS.cy + r*Math.sin(rad)];
}

function layoutAll(data){
  const buckets = new Map();
  data.forEach(d=>{
    const key = d.maturity + '|' + d.benefit;
    if(!buckets.has(key)) buckets.set(key, []);
    buckets.get(key).push(d);
  });
  const out = [];
  buckets.forEach((items, key)=>{
    const [maturity, benefit] = key.split('|');
    const [a0,a1] = SECTOR_BOUNDS[maturity];
    const [r0,r1] = RING_BOUNDS[benefit];
    const angPad = (a1-a0)*0.14;
    const radPad = (r1-r0)*0.12;
    const aStart = a0+angPad, aEnd = a1-angPad;
    const rStart = r0+radPad, rEnd = r1-radPad;
    const sorted = [...items].sort((x,y)=>x.name.localeCompare(y.name));
    const n = sorted.length;
    const cols = Math.min(n,6);
    const rows = Math.ceil(n/cols);
    sorted.forEach((d,i)=>{
      const row = Math.floor(i/cols);
      const rowStartIdx = row*cols;
      const itemsInRow = Math.min(cols, n-rowStartIdx);
      const colIdx = i - rowStartIdx;
      const angle = itemsInRow>1 ? aStart + (aEnd-aStart)*(colIdx/(itemsInRow-1)) : (aStart+aEnd)/2;
      let radius = rows>1 ? rStart + (rEnd-rStart)*(row/(rows-1)) : (rStart+rEnd)/2;
      if(d.id === 'autonomous-drone-swarms') radius = rEnd;
      const [x,y] = polarToXY(angle, radius);
      out.push(Object.assign({}, d, { x, y }));
    });
  });
  return out;
}

function RadarChart({ data, allData, selectedId, onSelect, onHover, onHoverEnd }){
  const svgRef = useRef(null);
  const positioned = useMemo(()=>layoutAll(allData), [allData]);
  const includedIds = useMemo(()=> new Set(data.map(d=>d.id)), [data]);

  useEffect(()=>{
    if(!svgRef.current) return;
    const svg = d3.select(svgRef.current);
    svg.selectAll('*').remove();
    const g = svg.append('g');

    const ringRadii = BENEFITS.map(b=>RING_BOUNDS[b][1]);

    g.append('g').selectAll('circle')
      .data([...ringRadii].reverse())
      .join('circle')
      .attr('cx', DIMS.cx).attr('cy', DIMS.cy)
      .attr('r', r=>r)
      .style('fill', 'var(--text-primary)')
      .style('fill-opacity', (r,i)=>[0.025,0.045,0.07][i])
      .style('stroke','none');

    g.append('g').selectAll('line')
      .data(MATURITIES)
      .join('line')
      .attr('class','divider-line')
      .each(function(m){
        const a0 = SECTOR_BOUNDS[m][0];
        const [x1,y1] = polarToXY(a0, DIMS.inner);
        const [x2,y2] = polarToXY(a0, DIMS.outer);
        d3.select(this).attr('x1',x1).attr('y1',y1).attr('x2',x2).attr('y2',y2);
      });

    g.append('g').selectAll('circle')
      .data(ringRadii)
      .join('circle')
      .attr('class','ring-circle')
      .attr('cx', DIMS.cx).attr('cy', DIMS.cy).attr('r', r=>r);

    g.append('g').selectAll('text')
      .data(MATURITIES)
      .join('text')
      .attr('class','sector-label')
      .attr('text-anchor','middle')
      .style('fill','var(--text-secondary)')
      .attr('transform', m=>{
        const [a0,a1] = SECTOR_BOUNDS[m];
        const [x,y] = polarToXY((a0+a1)/2, DIMS.outer + 58);
        return `translate(${x},${y})`;
      })
      .text(m=>m);

    const hub = g.append('g').attr('transform', `translate(${DIMS.cx},${DIMS.cy})`);
    hub.append('circle').attr('class','hub-circle').attr('r', DIMS.inner-6);
    hub.append('text').attr('class','hub-title').attr('text-anchor','middle').attr('y',-6).text('DEFRA');
    hub.append('text').attr('class','hub-sub').attr('text-anchor','middle').attr('y',10).text('SUSTAINABILITY');
    hub.append('text').attr('class','hub-sub').attr('text-anchor','middle').attr('y',20).text('RADAR 2026');

    const dotG = g.append('g').selectAll('g.dot')
      .data(positioned, d=>d.id)
      .join('g')
      .attr('class','dot')
      .attr('transform', d=>`translate(${d.x},${d.y})`)
      .attr('tabindex', 0)
      .attr('role','button')
      .attr('aria-label', d=>`${d.name}. ${d.theme}. ${d.maturity} maturity. ${d.benefit} benefit. Overall score ${d.overall.toFixed(1)} of 10.`)
      .style('cursor','pointer')
      .style('opacity', d=> includedIds.has(d.id) ? 1 : 0.10)
      .style('pointer-events', d=> includedIds.has(d.id) ? 'auto' : 'none');

    dotG.append('circle')
      .attr('class','dot-mark')
      .attr('r', d=>priorityRadius(d.overall))
      .style('fill', d=>`var(--cat-${THEME_SLOT[d.theme]})`)
      .style('color', d=>`var(--cat-${THEME_SLOT[d.theme]})`)
      .attr('stroke', d=> d.id===selectedId ? 'var(--text-primary)' : 'var(--surface)')
      .attr('stroke-width', d=> d.id===selectedId ? 2.5 : 1.5);

    dotG.filter(d=>d.overall>=8).append('circle')
      .attr('class','priority-ring')
      .attr('r', d=>priorityRadius(d.overall) + 4)
      .attr('fill','none');

    const ringLabelG = g.append('g').selectAll('g')
      .data(BENEFITS.map(b=>({ b, r:(RING_BOUNDS[b][0]+RING_BOUNDS[b][1])/2 })))
      .join('g');
    ringLabelG.each(function(d){
      const sel = d3.select(this);
      [DIMS.cx - d.r, DIMS.cx + d.r].forEach(x=>{
        const label = sel.append('text')
          .attr('class','ring-label')
          .attr('text-anchor','middle')
          .attr('x', x)
          .attr('y', DIMS.cy - 8)
          .text(d.b);
        const box = label.node().getBBox();
        sel.insert('rect', 'text:last-of-type')
          .attr('class','ring-label-bg')
          .attr('x', box.x - 6)
          .attr('y', box.y - 3)
          .attr('width', box.width + 12)
          .attr('height', box.height + 6)
          .attr('rx', 5);
      });
    });

    dotG
      .on('mouseenter', (event,d)=>onHover(d,event))
      .on('mousemove', (event,d)=>onHover(d,event))
      .on('mouseleave', ()=>onHoverEnd())
      .on('click', (event,d)=>onSelect(d.id))
      .on('keydown', (event,d)=>{
        if(event.key==='Enter' || event.key===' '){ event.preventDefault(); onSelect(d.id); }
      });
  }, [positioned, includedIds, selectedId]);

  return h('div', { className:'radar-wrap' },
    h('div', { className:'radar-sweep', 'aria-hidden':'true' }),
    h('svg', {
      ref: svgRef,
      viewBox: '0 0 1000 1000',
      className: 'radar-svg',
      role: 'img',
      'aria-label': 'Radar chart of sustainability technologies, arranged by theme sector and maturity ring'
    })
  );
}

function TableView({ data, onSelect, selectedId }){
  const [sortKey, setSortKey] = useState('overall');
  const [sortDir, setSortDir] = useState('desc');

  function sortBy(key){
    if(sortKey===key){ setSortDir(d=> d==='desc'?'asc':'desc'); }
    else { setSortKey(key); setSortDir(key==='name'?'asc':'desc'); }
  }

  const sorted = useMemo(()=>{
    const arr = [...data];
    arr.sort((a,b)=>{
      let av=a[sortKey], bv=b[sortKey];
      if(typeof av === 'string'){ av=av.toLowerCase(); bv=bv.toLowerCase(); }
      if(av<bv) return sortDir==='asc' ? -1 : 1;
      if(av>bv) return sortDir==='asc' ? 1 : -1;
      return 0;
    });
    return arr;
  }, [data, sortKey, sortDir]);

  function arrow(key){ return sortKey===key ? (sortDir==='asc' ? ' ▲' : ' ▼') : ''; }

  return h('div', { className:'table-wrap' },
    h('div', { className:'table-scroll' },
      h('table', { className:'tech-table' },
        h('thead', null,
          h('tr', null,
            h('th', { onClick:()=>sortBy('name') }, 'Technology', arrow('name')),
            h('th', { onClick:()=>sortBy('theme') }, 'Theme', arrow('theme')),
            h('th', { onClick:()=>sortBy('maturity') }, 'Maturity', arrow('maturity')),
            h('th', { onClick:()=>sortBy('benefit') }, 'Benefit', arrow('benefit')),
            h('th', { onClick:()=>sortBy('overall') }, 'Overall', arrow('overall'))
          )
        ),
        h('tbody', null,
          sorted.map(d => h('tr', { key:d.id, className: d.id===selectedId?'selected':'', onClick:()=>onSelect(d.id) },
            h('td', null, h('div', { className:'name-cell' },
              h('span', { className:'legend-swatch', style:{ background:`var(--cat-${THEME_SLOT[d.theme]})` } }),
              d.name
            )),
            h('td', null, h('span', { className:'theme-pill' },
              h('span', { className:'legend-swatch', style:{ background:`var(--cat-${THEME_SLOT[d.theme]})` } }),
              d.theme
            )),
            h('td', null, h('span', { className:'maturity-pill' }, d.maturity)),
            h('td', null, h('span', { className:'maturity-pill' }, d.benefit)),
            h('td', { className:'num-cell' }, d.overall.toFixed(2))
          )),
          sorted.length===0
            ? h('tr', null, h('td', { colSpan:'5', style:{ textAlign:'center', color:'var(--text-muted)', padding:'22px' } }, 'No technologies match the current filters.'))
            : null
        )
      )
    )
  );
}

function Meter({ label, value, max, color }){

  return h('div', { className:'meter-row' },

    h('div', { className:'meter-track' },

  );
}

const FEEDLY_PROXY_URL = 'http://localhost:8787/api/articles';

function LiveArticles({ tech }){
  const [status, setStatus] = useState('loading');
  const [articles, setArticles] = useState([]);

  useEffect(()=>{
    let active = true;
    setStatus('loading');
    setArticles([]);
    fetch(`${FEEDLY_PROXY_URL}?query=${encodeURIComponent(tech.name)}`)
      .then(res => { if(!res.ok) throw new Error('proxy_error'); return res.json(); })
      .then(data => {
        if(!active) return;
        setArticles(data.articles || []);
        setStatus('ready');
      })
      .catch(() => { if(active) setStatus('unavailable'); });
    return () => { active = false; };
  }, [tech.id]);

  return h('div', { className:'live-articles' },
    h('div', { className:'section-label' }, 'Latest from Feedly'),
    status==='loading' ? h('p', { className:'live-status' }, 'Checking Feedly for recent coverage…') : null,
    status==='unavailable' ? h('p', { className:'live-status' },
      'Live articles unavailable. Start the local proxy (', h('code', null, 'python3 feedly_proxy.py'), ') with your Feedly key set, then reopen this card.'
    ) : null,
    status==='ready' && articles.length===0 ? h('p', { className:'live-status' }, 'No recent articles found for this technology.') : null,
    status==='ready' && articles.length>0 ? h('div', { className:'article-list' },
      articles.map((a,i) => h('a', {
        key:i, className:'article-item', href:a.url, target:'_blank', rel:'noopener noreferrer'
      },
        h('div', { className:'article-title' }, a.title),
        h('div', { className:'article-meta' },
          a.source + (a.published ? ' · ' + new Date(a.published).toLocaleDateString(undefined, { year:'numeric', month:'short', day:'numeric' }) : '')
        ),
        a.summary ? h('div', { className:'article-summary' }, a.summary) : null
      ))
    ) : null
  );
}

function Modal({ onClose, children }){
  useEffect(()=>{
    function onKey(e){ if(e.key==='Escape') onClose(); }
    document.addEventListener('keydown', onKey);
    const prevOverflow = document.body.style.overflow;
    document.body.style.overflow = 'hidden';
    return ()=>{
      document.removeEventListener('keydown', onKey);
      document.body.style.overflow = prevOverflow;
    };
  }, [onClose]);
  return h('div', { className:'modal-overlay', onClick:onClose },
    h('div', { className:'modal-card', role:'dialog', 'aria-modal':'true', onClick:e=>e.stopPropagation() },
      children
    )
  );
}

function App(){
  const [search, setSearch] = useState('');
  const [activeThemes, setActiveThemes] = useState(()=> new Set(THEMES.map(t=>t.name)));
  const [selectedId, setSelectedId] = useState(null);
  const [hover, setHover] = useState(null);
  const [view, setView] = useState('radar');
  const [themePref, setThemePref] = useState('system');
  const [activePriorityId, setActivePriorityId] = useState(PRIORITY_BRIEFINGS[0].id);
  const [introVisible, setIntroVisible] = useState(true);
  const [introClosing, setIntroClosing] = useState(false);

  function closeIntro(){
    setIntroClosing(true);
    setTimeout(()=> setIntroVisible(false), 480);
  }
  function reopenIntro(){
    setIntroClosing(false);
    setIntroVisible(true);
  }

  useEffect(()=>{
    const root = document.documentElement;
    if(themePref==='system') root.removeAttribute('data-theme');
    else root.setAttribute('data-theme', themePref);
  }, [themePref]);

  const filtered = useMemo(()=> DATA.filter(d=>
    activeThemes.has(d.theme) &&
    (search.trim()==='' ||
      d.name.toLowerCase().includes(search.toLowerCase()) ||
      d.description.toLowerCase().includes(search.toLowerCase()) ||
      d.theme.toLowerCase().includes(search.toLowerCase()))
  ), [search, activeThemes]);

  const selected = DATA.find(d=>d.id===selectedId) || null;
  const topPriority = useMemo(()=> [...DATA].sort((a,b)=>b.overall-a.overall).slice(0,5), []);

  function toggleTheme(name){
    setActiveThemes(prev=>{
      const next = new Set(prev);
      if(next.has(name)) next.delete(name); else next.add(name);
      return next.size===0 ? new Set(THEMES.map(t=>t.name)) : next;
    });
  }
  function resetFilters(){
    setActiveThemes(new Set(THEMES.map(t=>t.name)));
    setSearch('');
  }
  function clearThemes(){
    setActiveThemes(new Set());
  }
  function cycleThemePref(){
    setThemePref(p=> p==='system' ? 'dark' : p==='dark' ? 'light' : 'system');
  }

  return h('div', { className:'app-shell' },
    introVisible ? h(IntroSplash, { closing:introClosing, onProceed:closeIntro }) : null,
    h('div', { className:'header' },
      h('div', { className:'brand' },
        h('div', { className:'brand-bars' },
          h('span', { className:'bar bar-a' }),
          h('span', { className:'bar bar-b' })
        ),
        h('div', null,
          h('div', { className:'eyebrow' }, 'Defra DDTS · Technology Innovation'),
          h('h1', null, 'Sustainability Technology Radar'),
          h('p', null, `A 2026 horizon scan of ${DATA.length} technologies mapped against sustainability themes, maturity and expected benefit to Defra group.`)
        )
      ),
      h('div', { className:'header-controls' },
        h('input', {
          className:'search-input', type:'text', placeholder:'Search technologies…',
          value:search, onChange:e=>setSearch(e.target.value), 'aria-label':'Search technologies'
        }),
        h('div', { className:'segmented', role:'tablist', 'aria-label':'View mode' },
          h('button', { className: view==='radar'?'active':'', onClick:()=>setView('radar') }, 'Radar'),
          h('button', { className: view==='table'?'active':'', onClick:()=>setView('table') }, 'Table')
        ),
        h('button', { className:'icon-btn', onClick:cycleThemePref, title:'Toggle colour theme' },
          themePref==='system' ? 'Theme: Auto' : themePref==='dark' ? 'Theme: Dark' : 'Theme: Light'
        ),
        h('button', { className:'icon-btn', onClick:reopenIntro }, 'Return to introduction')
      )
    ),
    h('div', { className:'panel intro-banner' },
      h(IntroCard, { count:filtered.length, total:DATA.length })
    ),
    h('div', { className:'main-grid' },
      h('div', { className:'panel chart-panel' },
        h('div', { className:'chart-caption' },

        ),

          : h(TableView, { data:filtered, onSelect:setSelectedId, selectedId:selectedId }),

      h('div', { className:'section-label' }, 'Priority technologies'),
      h('div', { className:'priority-intro' },
        h('p', null, 'The top-rated emerging technologies have been ranked using a weighted scoring model based on four key criteria: the extent to which each technology could help Defra Group achieve sustainability goals, the potential to reduce emissions, waste or resource use, how useful it is across Defra and its partner organisations, and how practical it is to implement in terms of skills, suppliers and regulatory feasibility. The scoring is designed to reflect both strategic value and delivery readiness, so the highest-ranked technologies are the ones that are most likely to deliver meaningful sustainability outcomes in a realistic and scalable way.'),
        h('p', null, 'This approach helps decision-makers focus attention on the technologies that matter most. By combining environmental impact with cross-organisational relevance and feasibility, the ranking identifies the most important emerging technologies to prioritise for further development, investment and adoption. In short, the model supports a more evidence-based selection process, ensuring that attention is directed towards solutions with the greatest potential to support Defra Group’s sustainability objectives.')
      ),
      h(PriorityStrip, { items:topPriority, activeId:activePriorityId, onSelectPriority:setActivePriorityId }),
      h('div', { className:'section-label', style:{ marginTop:16 } }, 'Strategic briefing — adoption roadmap for the top 5'),
      h(PriorityBriefingTable, { briefings:PRIORITY_BRIEFINGS, activeId:activePriorityId, onSelect:setSelectedId })
    ),
    h('div', { className:'footer-note' },
      'Technology names, theme groupings, maturity stages, benefit ratings and overall scores are adapted from Defra DDTS’s 2026 Emerging Technology Radar and the "Mapping of Emerging Digital Technologies to Business Areas" sustainability workbook. Positions within each sector/ring are laid out for legibility and do not encode additional meaning beyond theme and maturity. This tool is intended to support internal discussion and prioritisation, not as a definitive or official published radar.'
    ),
    hover ? h(Tooltip, { info:hover }) : null,
    selected
      ? h(Modal, { onClose:()=>setSelectedId(null) },
          h(DetailCard, { tech:selected, onClose:()=>setSelectedId(null) })
        )
      : null
  );
}

const rootEl = ReactDOM.createRoot(document.getElementById('root'));
rootEl.render(h(App));
</script>
</body>
</html>
